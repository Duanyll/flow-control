[project]
name = "flow-control"
version = "0.1.0"
description = "Training utilities for flow-matching Diffusion Transformers (DiTs)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "aiohttp>=3.14.5",
    "bitsandbytes>=0.50.2 ; sys_platform == 'linux' or sys_platform == 'win32'",
    "datasets>=5.1.0",
    "diffusers>=0.41.0",
    "einops>=0.8.2",
    "gradio>=6.31.0",
    "json5>=0.17.3",
    "jsonpath-ng>=1.16.0",
    "lmdb>=3.0.0",
    "open-clip-torch>=3.3.0",
    "peft>=0.21.2",
    "prodigyopt>=1.1.2",
    "protobuf>=7.36.2",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "sentencepiece>=0.2.3",
    "starlette>=1.10.0",
    "timm>=1.0.31",
    "torch>=2.15.0", # per-block compile (docs/adapters/parallelize.md) is validated on 2.15; cu132 index, runs on the 590 / 615 drivers
    "torchdata>=0.11.0",
    "torchvision>=0.29.2", # paired with torch
    "trackio>=0.45.0",
    "transformers>=5.22.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "lefthook>=2.2.2",
    "ruff>=0.17.4",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "ipython>=9.18.1",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "py-spy>=0.4.3",
    "scipy>=1.18.1",
    "ty==0.0.74",
    "pytest>=9.2.0",
    "pytest-subtests>=0.15.0",
]
iqa = [
    "pyiqa>=0.1.16",
]
# OCR reward backend (flow_control/rewards/ocr.py). A dependency-group rather
# than an extra so `default-groups` can keep it installed across `uv sync`.
ocr = [
    "onnxruntime-gpu>=1.31.1",
    "rapidocr>=3.10.0",
]

[project.scripts]
flow-control = "flow_control.scripts.cli:main"
describe = "flow_control.scripts.describe:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# Install the `ocr` group on `uv sync` (alongside `dev`) so the RapidOCR / ONNX
# Runtime backend stays resolved instead of being pruned. Drop it for a lean
# environment with `uv sync --no-default-groups` (or `--only-group dev`).
default-groups = ["dev", "ocr"]

[tool.uv.build-backend]
module-name = "flow_control"
module-root = ""

[tool.uv.sources]
torch = [
  { index = "pytorch", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
xformers = [
  { index = "pytorch", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
diffusers = { git = "https://github.com/huggingface/diffusers.git", rev = "d3d8af89e5b08a352cf47bba3a451c5fed9a49b1" }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-print
    "T20",
    # isort
    "I",
    # mccabe
    "C90",
]
ignore = [
    "E501",  # line too long
    "E741",  # ambiguous variable name
    "B027",  # empty function in abstract class
]
exclude = [
    "examples/**",
    "flow_control/third_party/**",
    "notebooks/**",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty.src]
include = ["flow_control", "tests", "examples", "docs"]
exclude = ["flow_control/third_party"]

[tool.ty.analysis]
# Torch is required here, so Diffusers' no-Torch fallback module is unreachable.
replace-imports-with-any = ["diffusers.utils.dummy_pt_objects"]
# Gradual narrowing for bare generic runtime checks.
strict-generic-narrowing = false

[tool.ty.rules]
# Pydantic discriminated unions require Literal overrides of `type` fields in subclasses.
invalid-attribute-override = "ignore"
# A suppression that no longer suppresses anything is dead weight; report it.
unused-ignore-comment = "error"
# HuggingFace officially uses private imports a lot, so we don't flag them.
possibly-missing-submodule = "ignore"
possibly-unresolved-reference = "error"
redundant-cast = "ignore"
