pre-commit:
  parallel: false
  commands:
    ruff-format:
      glob: "*.py"
      exclude:
        - "flow_control/third_party/**"
        - "notebooks/**"
        - "docs/**"
      run: uv run ruff format {staged_files}
      stage_fixed: true

    ruff-check:
      glob: "*.py"
      exclude:
        - "flow_control/third_party/**"
        - "notebooks/**"
        - "docs/**"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true

    # Whole-project, not {staged_files}: type errors cross file boundaries.
    ty:
      glob: "*.py"
      exclude:
        - "flow_control/third_party/**"
        - "notebooks/**"
      run: uv run ty check